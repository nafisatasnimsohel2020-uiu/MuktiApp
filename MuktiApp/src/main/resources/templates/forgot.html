<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password & OTP | MUKTI APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/global.css}" rel="stylesheet">
    <style>
        :root {
            --primary: #10B981;
            --primary-light: #34D399;
            --primary-dark: #059669;
            --secondary: #F59E0B;
            --secondary-light: #FCD34D;
            --accent: #F97316;
            --dark: #0f172a;
            --dark-warm: #120e0a;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(20px);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-pill: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', 'Inter', 'Hind Siliguri', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #24160e, #120e0a);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 44px 36px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: white;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px 15px 52px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.45);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Console OTP Helper Box */
        .console-otp-box {
            background: rgba(18, 14, 10, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .console-otp-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--secondary-light);
            margin-bottom: 6px;
        }

        .console-otp-code {
            font-family: 'Courier New', monospace;
            background: rgba(16, 185, 129, 0.15);
            border: 1px dashed rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            margin: 6px 0;
            letter-spacing: 3px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .footer a {
            color: var(--secondary-light);
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            padding: 14px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary-light);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .hidden { display: none !important; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s infinite linear;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="card">
        <header class="header">
            <h1 id="page-title" data-en="Reset Password" data-bn="পাসওয়ার্ড পরিবর্তন">Reset Password</h1>
            <p id="page-subtitle" data-en="We will help you regain account access." data-bn="আপনার অ্যাকাউন্টের অ্যাক্সেস ফিরিয়ে নিতে সাহায্য করা হবে।">
                We will help you regain account access.
            </p>
        </header>

        <!-- Notification Area -->
        <div id="alert-box" class="alert">
            <i id="alert-icon" class="fas"></i>
            <span id="alert-message">Message</span>
        </div>

        <!-- Console OTP Notification Box -->
        <div id="console-otp-box" class="console-otp-box">
            <div class="console-otp-title">
                <i class="fas fa-terminal"></i>
                <span data-en="OTP Displayed in Console!" data-bn="কনসোলে ওটিপি প্রদর্শিত হয়েছে!">OTP Displayed in Console!</span>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-muted);" data-en="Open DevTools (Press F12 &rarr; Console) or see the server logs." data-bn="ব্রাউজার কনসোল (F12 &rarr; Console) অথবা সার্ভার লগ চেক করুন।">
                Open DevTools (Press F12 &rarr; Console) or see the server logs.
            </p>
            <div id="otpDisplaySpan" class="console-otp-code">------</div>
            <button type="button" id="autoFillBtn" style="background: none; border: 1px solid var(--secondary); color: var(--secondary-light); padding: 4px 10px; border-radius: var(--radius-pill); font-size: 0.75rem; cursor: pointer; font-weight: 700; display: block; margin-top: 6px;" data-en="Auto-Fill OTP" data-bn="ওটিপি স্বয়ংক্রিয়ভাবে বসান">
                Auto-Fill OTP
            </button>
        </div>

        <!-- Step 1: Email or Phone Input -->
        <div id="step-email" class="step-container">
            <form id="email-form" onsubmit="handleEmailSubmit(event)">
                <div class="form-group">
                    <label class="form-label" data-en="Email or Phone Number" data-bn="ইমেইল বা ফোন নম্বর">Email or Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="email" class="input-field" placeholder="your@email.com or 01XXXXXXXXX" required
                            data-placeholder-en="your@email.com or 01XXXXXXXXX" data-placeholder-bn="আপনার ইমেইল বা ফোন নম্বর লিখুন">
                    </div>
                </div>
                <button type="submit" class="btn" id="email-btn">
                    <span data-en="Send OTP Code" data-bn="ওটিপি পাঠান">Send OTP Code</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Step 2: OTP Verification & New Password -->
        <div id="step-otp" class="step-container hidden">
            <form id="otp-form" onsubmit="handleOtpSubmit(event)">
                <div class="form-group">
                    <label class="form-label" data-en="Enter 6-Digit OTP" data-bn="৬ ডিজিটের ওটিপি লিখুন">Enter 6-Digit OTP</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="text" id="otp" class="input-field" placeholder="6-digit code" maxlength="6"
                            pattern="\d{6}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-en="New Password" data-bn="নতুন পাসওয়ার্ড">New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" class="input-field" placeholder="Enter new password" required
                            data-placeholder-en="Enter new password" data-placeholder-bn="নতুন পাসওয়ার্ড লিখুন">
                    </div>
                </div>

                <button type="submit" class="btn" id="otp-btn">
                    <span data-en="Reset Password & Login" data-bn="পাসওয়ার্ড আপডেট করুন">Reset Password & Login</span>
                    <div class="spinner"></div>
                </button>
                <div style="text-align: center; margin-top: 16px;">
                    <button type="button" onclick="resetView()"
                        style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.88rem;" data-en="&larr; Change Account" data-bn="&larr; অ্যাকাউন্ট পরিবর্তন করুন">&larr; Change Account</button>
                </div>
            </form>
        </div>

        <div class="footer">
            <p data-en="Remembered? " data-bn="পাসওয়ার্ড মনে পড়েছে? ">Remembered? <a th:href="@{/login}" data-en="Back to Login" data-bn="লগইনে ফিরে যান">Back to Login</a></p>
        </div>
    </div>

    <!-- Global JavaScript with bilingual and live notifications engine -->
    <script th:src="@{/js/global.js}"></script>
    <script th:inline="javascript">
        let currentReceivedOtp = '';

        function showAlert(type, message) {
            const box = document.getElementById('alert-box');
            const icon = document.getElementById('alert-icon');
            const msg = document.getElementById('alert-message');

            box.style.display = 'flex';
            box.className = `alert alert-${type}`;
            msg.textContent = message;

            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
            } else {
                icon.className = 'fas fa-exclamation-circle';
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').style.display = 'none';
        }

        function setLoading(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            const spinner = btn.querySelector('.spinner');
            const text = btn.querySelector('span');

            if (isLoading) {
                btn.disabled = true;
                spinner.style.display = 'block';
                text.style.opacity = '0.5';
            } else {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.style.opacity = '1';
            }
        }

        // Step 1: Request OTP
        async function handleEmailSubmit(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value.trim();
            setLoading('email-btn', true);

            try {
                const formData = new FormData();
                formData.append('email', email);

                const response = await fetch('/forgot/send-otp', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    currentReceivedOtp = data.otp || '';

                    // ✅ SHOW IN BROWSER CONSOLE (Press F12)
                    if (window.logMuktiOtp && currentReceivedOtp) {
                        window.logMuktiOtp(currentReceivedOtp, email);
                    }
                    console.log(
                        "%c🔑 [MUKTI APP OTP VERIFICATION] " +
                        "%cYour OTP is: %c" + currentReceivedOtp,
                        "background: #120e0a; color: #f59e0b; font-weight: bold; padding: 4px 8px; border-radius: 4px;",
                        "color: #ffffff; font-weight: bold;",
                        "background: #10b981; color: #000000; font-weight: 900; font-size: 18px; padding: 4px 12px; border-radius: 4px; letter-spacing: 2px;"
                    );

                    showAlert('success', 'OTP Sent! Check console (Press F12 &rarr; Console).');
                    document.getElementById('step-email').classList.add('hidden');
                    document.getElementById('step-otp').classList.remove('hidden');
                    document.getElementById('page-subtitle').textContent = `Verification sent for: ${email}`;

                    // Show console helper box
                    const otpBox = document.getElementById('console-otp-box');
                    if (otpBox) {
                        otpBox.style.display = 'block';
                        document.getElementById('otpDisplaySpan').textContent = currentReceivedOtp || '123456';
                    }
                } else {
                    showAlert('error', data.message || 'Failed to send OTP. Check email/phone.');
                }
            } catch (err) {
                console.error(err);
                showAlert('error', 'Something went wrong. Please try again.');
            } finally {
                setLoading('email-btn', false);
            }
        }

        // Auto fill button
        document.getElementById('autoFillBtn')?.addEventListener('click', () => {
            if (currentReceivedOtp) {
                document.getElementById('otp').value = currentReceivedOtp;
            }
        });

        // Step 2: Reset Password using OTP
        async function handleOtpSubmit(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            setLoading('otp-btn', true);

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('otp', otp);
                formData.append('newPassword', newPassword);

                const response = await fetch('/forgot/reset-password', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showAlert('success', 'Password Reset Successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/login?reset=success';
                    }, 1400);
                } else {
                    showAlert('error', data.message || 'Invalid or expired OTP code.');
                }
            } catch (err) {
                console.error(err);
                showAlert('error', 'Verification failed. Try again.');
            } finally {
                setLoading('otp-btn', false);
            }
        }

        function resetView() {
            document.getElementById('step-otp').classList.add('hidden');
            document.getElementById('step-email').classList.remove('hidden');
            document.getElementById('console-otp-box').style.display = 'none';
            document.getElementById('page-subtitle').textContent = "We will help you regain account access.";
            hideAlert();
        }
    </script>
</body>

</html>
